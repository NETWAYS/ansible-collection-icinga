---
- ansible.builtin.gather_facts:
  tags: always

- name: Include OS specific vars
  ansible.builtin.include_vars: "{{ lookup('first_found', _params) }}"
  vars:
    _params:
      files:
        - "{{ ansible_facts['os_family'] }}-{{ ansible_facts['distribution'] }}-{{ ansible_facts['distribution_major_version'] }}.yml"
        - "{{ ansible_facts['os_family'] }}-{{ ansible_facts['distribution_major_version'] }}.yml"
        - "{{ ansible_facts['os_family'] }}-{{ ansible_facts['distribution'] }}.yml"
        - "{{ ansible_facts['os_family'] }}.yml"
        - default.yml
      paths:
        - "{{ role_path }}/vars"
  tags: always

- name: Install
  ansible.builtin.include_tasks:
    file: install.yml
    apply:
      tags:
        - icinga2_install
  tags:
    - icinga2_install

- name: Configure
  ansible.builtin.include_tasks:
    file: configure.yml
    apply:
      tags:
        - icinga2_configure
  tags:
    - icinga2_configure

- name: Manage service
  ansible.builtin.include_tasks: service.yml
