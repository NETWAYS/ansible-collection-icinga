---

name: Build
on:
  workflow_dispatch:
  push:
    tags:
      - '*'
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
      - '!doc/**'
    paths:
      - roles/**
      - plugins/**
      - molecule/default/**
  pull_request:
    branches:
      - 'feature/**'
      - 'fix/**'
      - '!doc/**'

jobs:
  # No 2.14 due to missing support in community.docker
  icinga-default-scenario-ansible-2_15:
    uses: ./.github/workflows/icinga_default_scenario.yml
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        distro: [ubuntu2604]
        python: ['3.9', '3.10', '3.11']
        ansible: ['2.15']
        scenario: [default]
    with:
      distro: ${{ matrix.distro }}
      python: ${{ matrix.python }}
      ansible: ${{ matrix.ansible }}
      scenario: ${{ matrix.scenario }}

  icinga-default-scenario-ansible-2_16-and-2_17:
    uses: ./.github/workflows/icinga_default_scenario.yml
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        distro: [ubuntu2604]
        python: ['3.10', '3.11', '3.12']
        ansible: ['2.16', '2.17']
        scenario: [default]
    with:
      distro: ${{ matrix.distro }}
      python: ${{ matrix.python }}
      ansible: ${{ matrix.ansible }}
      scenario: ${{ matrix.scenario }}

  icinga-default-scenario-ansible-2_18-and-2_19:
    uses: ./.github/workflows/icinga_default_scenario.yml
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        distro: [ubuntu2604]
        python: ['3.11', '3.12', '3.13']
        ansible: ['2.18', '2.19']
        scenario: [default]
    with:
      distro: ${{ matrix.distro }}
      python: ${{ matrix.python }}
      ansible: ${{ matrix.ansible }}
      scenario: ${{ matrix.scenario }}

  icinga-default-scenario-ansible-2_20-and-2_21:
    uses: ./.github/workflows/icinga_default_scenario.yml
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        distro: [ubuntu2604]
        python: ['3.12', '3.13', '3.14']
        ansible: ['2.20', '2.21']
        scenario: [default]
    with:
      distro: ${{ matrix.distro }}
      python: ${{ matrix.python }}
      ansible: ${{ matrix.ansible }}
      scenario: ${{ matrix.scenario }}
