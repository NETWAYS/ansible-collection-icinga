---

- name: Database Setup
  gather_facts: true
  become: true
  hosts: "{{ _target }}"

  handlers:
    - name: Restart Prometheus
      listen: _restart_prometheus
      ansible.builtin.systemd_service:
        state: restarted
        enabled: true
        name: "prometheus"

    - name: Restart Apache2
      listen: _restart_apache
      ansible.builtin.systemd_service:
        state: restarted
        enabled: true
        name: "apache2"

  tasks:
    - name: Ensure Debian family
      ansible.builtin.assert:
        that:
          - ansible_facts.os_family == "Debian"
        fail_msg: "This demo playbook only supports the Debian OS family."

    - name: Databases
      ansible.builtin.include_role:
        name: geerlingguy.mysql

    - name: Repos
      ansible.builtin.include_role:
        name: netways.icinga.repos

    - name: Icinga2
      ansible.builtin.include_role:
        name: netways.icinga.icinga2

    - name: Icinga DB Redis
      ansible.builtin.include_role:
        name: netways.icinga.icingadb_redis

    - name: Icinga DB
      ansible.builtin.include_role:
        name: netways.icinga.icingadb

    - name: Flush handlers
      ansible.builtin.meta: flush_handlers

    - name: Icinga Web 2
      tags: icingaweb
      ansible.builtin.include_role:
        name: netways.icinga.icingaweb2
        apply:
          tags:
            - icingaweb

    - name: Icinga Web 2 navigation item directory
      tags: icingaweb
      ansible.builtin.file:
        state: directory
        path: "/etc/icingaweb2/preferences/{{ icingaweb2_admin_username }}/"
        owner: "{{ 'www-data' if ansible_facts.os_family == 'Debian' else 'apache' }}"
        group: "icingaweb2"
        mode: "2770"

    - name: Icinga Web 2 navigation item Prometheus
      tags: icingaweb
      ansible.builtin.copy:
        dest: "/etc/icingaweb2/preferences/{{ icingaweb2_admin_username }}/menu.ini"
        owner: "{{ 'www-data' if ansible_facts.os_family == 'Debian' else 'apache' }}"
        group: "icingaweb2"
        mode: "0660"
        content: |
          [Prometheus]
          type = "menu-item"
          target = "_blank"
          icon = "/prometheus/favicon.svg"
          url = "/prometheus"

          [Prometheus - Icinga 2]
          type = "menu-item"
          target = "_blank"
          icon = "/prometheus/favicon.svg"
          url = "/prometheus/query?g0.expr=state_check_perfdata"

          [2FA Settings]
          type = "menu-item"
          target = "_main"
          icon = "attention-circled"
          url = "two-factor/config"

    - name: Prometheus
      ansible.builtin.include_role:
        name: prometheus.prometheus.prometheus

    - name: Apache Prometheus config
      ansible.builtin.copy:
        dest: "/etc/apache2/conf-enabled/prometheus.conf"
        content: |
          RedirectMatch    301 ^/prometheus$ /prometheus/
          ProxyPass             /prometheus/ http://127.0.0.1:9090/
          ProxyPassReverse      /prometheus/ http://127.0.0.1:9090/
      notify: _restart_apache

    - name: Apache general redirect to /icingaweb2
      ansible.builtin.copy:
        dest: "/etc/apache2/conf-enabled/icingaweb2_redirect.conf"
        content: |
          RedirectMatch 301 ^/$ /icingaweb2/
      notify: _restart_apache

    - name: Apache modules config
      when: ansible_facts.os_family == "Debian"
      loop:
        - "rewrite"
        - "proxy"
        - "proxy_http"
      ansible.builtin.file:
        state: link
        src: "../mods-available/{{ item }}.load"
        dest: "/etc/apache2/mods-enabled/{{ item }}.load"

    - name: Add x509 job and schedule
      ansible.builtin.shell:
        cmd: |
          if [ $(mysql x509 -Ns -e "SELECT COUNT(*) FROM x509_job;") -eq 0 ]; then
            mysql x509 -e "
              INSERT IGNORE INTO x509_job
                (name, author, cidrs, ports, exclude_targets, ctime, mtime)
              VALUES
                ('Icinga2', 'admin', '127.0.0.1/32', '5665', NULL,
                 UNIX_TIMESTAMP(NOW()) * 1000,
                 UNIX_TIMESTAMP(NOW()) * 1000);

              INSERT IGNORE INTO x509_schedule
                (job_id, name, author, config, ctime, mtime)
              VALUES
                ((SELECT id FROM x509_job WHERE name = 'Icinga2'),
                 'Icinga2', 'admin',
                 '{\"since_last_scan\":null,\"type\":\"ipl\\\\\\\\Scheduler\\\\\\\\RRule\",\"frequency\":\"{\\\\\"rrule\\\\\":\\\\\"FREQ=HOURLY\\\\\",\\\\\"frequency\\\\\":\\\\\"HOURLY\\\\\",\\\\\"start\\\\\":\\\\\"1990-01-01T00:00:00.000000Europe\\\\\\\\/Berlin\\\\\"}\",\"full_scan\":\"n\",\"rescan\":\"n\"}',
                 UNIX_TIMESTAMP(NOW()) * 1000,
                 UNIX_TIMESTAMP(NOW()) * 1000);
            "
            echo "Job inserted"
          fi
      register: _x509_insert
      changed_when: "'Job inserted' in _x509_insert.stdout_lines"

    - name: Run x509 job initially
      when: _x509_insert.changed
      ansible.builtin.command:
        cmd: "icingacli x509 scan --job Icinga2"

    - name: Flush handlers
      ansible.builtin.meta: flush_handlers

    - name: Monitoring Plugins
      ansible.builtin.include_role:
        name: netways.icinga.monitoring_plugins

    - name: Check for Director hosts
      tags: icingaweb
      changed_when: false
      ansible.builtin.command:
        cmd: "icingacli director hosts list"
      register: _director_hosts

    - name: Add some initial demo configuration
      tags: icingaweb
      when: _director_hosts.stdout == ""
      block:
        - name: Add templates
          ansible.builtin.shell:
            cmd: |
              icingacli director host create --json '{
                  "object_type": "template",
                  "object_name": "Default Host",
                  "check_command": "hostalive4"
              }'
              icingacli director host create --json '{
                  "object_type": "template",
                  "object_name": "Agent Host",
                  "imports": "Default Host",
                  "has_agent": true,
                  "master_should_connect": false,
                  "accept_config": true
              }'
              icingacli director host create --json '{
                  "object_type": "template",
                  "object_name": "Linux Agent",
                  "imports": "Agent Host"
              }'
              icingacli director service create --json '{
                  "object_name": "Default Service",
                  "object_type": "template",
                  "check_command": "dummy"
              }'
              icingacli director service create --json '{
                  "object_name": "Agent Service",
                  "object_type": "template",
                  "imports": [
                      "Default Service"
                  ],
                  "use_agent": true
              }'
              icingacli director service create --json '{
                  "object_name": "Check Icinga",
                  "object_type": "template",
                  "imports": [
                      "Agent Service"
                  ],
                  "check_command": "icinga"
              }'
              icingacli director service create --json '{
                  "object_name": "Check IcingaDB",
                  "object_type": "template",
                  "imports": [
                      "Agent Service"
                  ],
                  "check_command": "icingadb"
              }'
              icingacli director service create --json '{
                  "object_name": "Check Disk",
                  "object_type": "template",
                  "imports": [
                      "Agent Service"
                  ],
                  "check_command": "disk"
              }'
              icingacli director service create --json '{
                  "object_name": "Check Load",
                  "object_type": "template",
                  "imports": [
                      "Agent Service"
                  ],
                  "check_command": "load"
              }'
              icingacli director service create --json '{
                  "object_name": "Check Curl",
                  "object_type": "template",
                  "imports": [
                      "Default Service"
                  ],
                  "check_command": "curl"

              }'
        - name: Add hosts
          ansible.builtin.shell:
            cmd: |
              icingacli director host create --json '{
                  "object_type": "object",
                  "object_name": "{{ icinga2_constants.NodeName }}",
                  "imports": "Linux Agent",
                  "address": "127.0.0.1"
              }'
              icingacli director host create --json '{
                  "object_type": "object",
                  "object_name": "netways.de",
                  "imports": "Default Host",
                  "address": "netways.de"
              }'
        - name: Add services
          ansible.builtin.shell:
            cmd: |
              icingacli director service create --json '{
                  "object_name": "IcingaDB",
                  "object_type": "object",
                  "host": "{{ icinga2_constants.NodeName }}",
                  "imports": [
                      "Check IcingaDB"
                  ]
              }'
              icingacli director service create --json '{
                  "object_name": "HTTP",
                  "object_type": "object",
                  "host": "netways.de",
                  "imports": [
                      "Check Curl"
                  ]
              }'
              icingacli director serviceset create --json '{
                  "assign_filter": "\"Linux Agent\"=host.templates",
                  "description": "Checks to be run by every Linux Icinga agent.",
                  "object_name": "Linux Agents",
                  "object_type": "template",
                  "services": [
                      {
                          "imports": [
                              "Check Disk"
                          ],
                          "object_name": "Disk",
                          "object_type": "object"
                      },
                      {
                          "imports": [
                              "Check Icinga"
                          ],
                          "object_name": "Icinga",
                          "object_type": "object"
                      },
                      {
                          "imports": [
                              "Check Load"
                          ],
                          "object_name": "Load",
                          "object_type": "object"
                      }
                  ]
              }'
        - name: Add dependencies
          ansible.builtin.shell:
            cmd: |
              icingacli director dependency create --json '{
                  "object_name": "Service To Service",
                  "object_type": "template",
                  "states": [
                      "OK",
                      "Warning"
                  ]
              }'
              icingacli director dependency create --json '{
                  "object_name": "Icinga 2 Agent",
                  "object_type": "apply",
                  "apply_to": "service",
                  "imports": [
                      "Service To Service"
                  ],
                  "parent_service_by_name": "Icinga",
                  "assign_filter": "service.command_endpoint=true&service.name!=%22Icinga%22"
              }'
        - name: Deploy configuration
          ansible.builtin.shell:
            cmd: "icingacli director config deploy"

  vars:
    # Prometheus
    prometheus_config_file: "full_stack/prometheus.yml.j2"
    prometheus_web_external_url: "/prometheus/"
    prometheus_config_flags_extra:
      web.route-prefix: "/"
      web.enable-otlp-receiver:

    # Credentials for Icinga Web 2
    icingaweb2_admin_username: "admin"
    icingaweb2_admin_password: "admin"

    ### Install MariaDB as DBMS
    mysql_daemon: "mariadb"
    mysql_packages:
      - "{{ 'mariadb-client' if ansible_facts.os_family == 'Debian' else 'mariadb' }}"
      - "{{ 'python3-pymysql' if ansible_facts.os_family == 'Debian' else 'python3-PyMySQL' }}"
      - "mariadb-server"
      - "python3-pymysql"

    mysql_databases_icingadb:
      name: "icingadb"
      username: "icingadb_user"
      password: "icingadb_password"

    mysql_databases_icingaweb2:
      name: "icingaweb2"
      username: "icingaweb2_user"
      password: "icingaweb2_password"

    mysql_databases_director:
      name: "director"
      username: "director_user"
      password: "director_password"
      encoding: "utf8"

    #mysql_databases_vspheredb:
    #  name: "vspheredb"
    #  username: "vspheredb_user"
    #  password: "vspheredb_password"
    #  encoding: "utf8mb4"
    #  collation: "utf8mb4_bin"

    mysql_databases_totp:
      name: "totp"
      username: "totp_user"
      password: "totp_password"
      encoding: "utf8"

    mysql_databases_x509:
      name: "x509"
      username: "x509_user"
      password: "x509_password"
      encoding: "utf8"

    mysql_databases:
      - name: "{{ mysql_databases_icingadb.name }}"
        encoding: "{{ mysql_databases_icingadb.encoding | default(omit) }}"
        collation: "{{ mysql_databases_icingadb.collation | default(omit) }}"
      - name: "{{ mysql_databases_icingaweb2.name }}"
        encoding: "{{ mysql_databases_icingaweb2.encoding | default(omit) }}"
        collation: "{{ mysql_databases_icingaweb2.collation | default(omit) }}"
      - name: "{{ mysql_databases_director.name }}"
        encoding: "{{ mysql_databases_director.encoding | default(omit) }}"
        collation: "{{ mysql_databases_director.collation | default(omit) }}"
      #- name: "{{ mysql_databases_vspheredb.name }}"
      #  encoding: "{{ mysql_databases_vspheredb.encoding | default(omit) }}"
      #  collation: "{{ mysql_databases_vspheredb.collation | default(omit) }}"
      - name: "{{ mysql_databases_totp.name }}"
        encoding: "{{ mysql_databases_totp.encoding | default(omit) }}"
        collation: "{{ mysql_databases_totp.collation | default(omit) }}"
      - name: "{{ mysql_databases_x509.name }}"
        encoding: "{{ mysql_databases_x509.encoding | default(omit) }}"
        collation: "{{ mysql_databases_x509.collation | default(omit) }}"
    mysql_users:
      - name: "{{ mysql_databases_icingadb.username }}"
        host: "localhost"
        password: "{{ mysql_databases_icingadb.password }}"
        priv: "{{ mysql_databases_icingadb.name }}.*:ALL"
      - name: "{{ mysql_databases_icingaweb2.username }}"
        host: "localhost"
        password: "{{ mysql_databases_icingaweb2.password }}"
        priv: "{{ mysql_databases_icingaweb2.name }}.*:ALL"
      - name: "{{ mysql_databases_director.username }}"
        host: "localhost"
        password: "{{ mysql_databases_director.password }}"
        priv: "{{ mysql_databases_director.name }}.*:ALL"
      #- name: "{{ mysql_databases_vspheredb.username }}"
      #  host: "localhost"
      #  password: "{{ mysql_databases_vspheredb.password }}"
      #  priv: "{{ mysql_databases_vspheredb.name }}.*:ALL"
      - name: "{{ mysql_databases_totp.username }}"
        host: "localhost"
        password: "{{ mysql_databases_totp.password }}"
        priv: "{{ mysql_databases_totp.name }}.*:ALL"
      - name: "{{ mysql_databases_x509.username }}"
        host: "localhost"
        password: "{{ mysql_databases_x509.password }}"
        priv: "{{ mysql_databases_x509.name }}.*:ALL"

    ### Repos
    icinga_repo_epel: true
    netways_repo_extras: true
    netways_repo_plugins: true

    ### Icinga2
    icinga2_confd: "local.d"
    icinga2_config_directories:
      - "local.d/"

    icinga2_constants:
      NodeName: "{{ inventory_hostname }}"
      ZoneName: "master"

    icinga2_features:
      - name: checker
      - name: mainlog
      - name: notification
      - name: icingadb
        environment_id: "df29d078f1fdeffddf3bcce81a8194397d326e11" # just something fixed, so destroy/build work right away
      - name: api
        parent_host: none
        cert_name: "{{ icinga2_constants.NodeName }}"
        endpoints:
          - name: "{{ icinga2_constants.NodeName }}"
        zones:
          - name: "{{ icinga2_constants.ZoneName }}"
            endpoints:
              - "{{ icinga2_constants.NodeName }}"
          - name: "director-global"
            global: true
          - name: "global-templates"
            global: true
          - name: "linux-agents"
            global: true
          - name: "windows-agents"
            global: true
      - name: otlpmetrics
        host: "127.0.0.1"
        port: 9090
        metrics_endpoint: "/api/v1/otlp/v1/metrics"
        enable_send_thresholds: true
        disconnect_timeout: "60s"

    icinga2_objects:
      - name: "icingadb"
        type: ApiUser
        file: "local.d/apiusers.conf"
        password: "icingadb"
        permissions:
          - "actions/*"
          - "status/query"
          - "objects/modify/*"
          - "objects/query/*"
      - name: director
        type: ApiUser
        file: "local.d/apiusers.conf"
        password: "director"
        permissions:
          - "*"

    ### IcingaDB
    icingadb_database_import_schema: true
    icingadb_database_host: "127.0.0.1"
    icingadb_database_type: mysql
    icingadb_database_name: "{{ mysql_databases_icingadb.name }}"
    icingadb_database_user: "{{ mysql_databases_icingadb.username }}"
    icingadb_database_password: "{{ mysql_databases_icingadb.password }}"

    ### Icinga Web 2
    icingaweb2_db_import_schema: true

    icingaweb2_db:
      type: mysql
      name: "{{ mysql_databases_icingaweb2.name }}"
      host: "127.0.0.1"
      user: "{{ mysql_databases_icingaweb2.username }}"
      password: "{{ mysql_databases_icingaweb2.password }}"

    icingaweb2_resources:
      icingadb_db:
        type: db
        db: mysql
        host: "localhost"
        dbname: "{{ mysql_databases_icingadb.name }}"
        username: "{{ mysql_databases_icingadb.username }}"
        password: "{{ mysql_databases_icingadb.password }}"
        use_ssl: 0
        charset: utf8
      director_db:
        type: db
        db: mysql
        host: "localhost"
        dbname: "{{ mysql_databases_director.name }}"
        username: "{{ mysql_databases_director.username }}"
        password: "{{ mysql_databases_director.password }}"
        use_ssl: 0
        charset: utf8
      #vspheredb_db:
      #  type: db
      #  db: mysql
      #  host: "localhost"
      #  dbname: "{{ mysql_databases_vspheredb.name }}"
      #  username: "{{ mysql_databases_vspheredb.username }}"
      #  password: "{{ mysql_databases_vspheredb.password }}"
      #  use_ssl: 0
      #  charset: "utf8mb4"
      totp_db:
        type: db
        db: mysql
        host: "localhost"
        dbname: "{{ mysql_databases_totp.name }}"
        username: "{{ mysql_databases_totp.username }}"
        password: "{{ mysql_databases_totp.password }}"
      x509_db:
        type: db
        db: mysql
        host: "localhost"
        dbname: "{{ mysql_databases_x509.name }}"
        username: "{{ mysql_databases_x509.username }}"
        password: "{{ mysql_databases_x509.password }}"

    icingaweb2_modules:
      icingadb:
        enabled: true
        source: package
        commandtransports:
          instance01:
            transport: api
            host: "127.0.0.1"
            username: "{{ icinga2_objects[0].name }}"
            password: "{{ icinga2_objects[0].password }}"
        config:
          icingadb:
            resource: "icingadb_db"
          redis:
            tls: "0"
        redis:
          redis1:
            host: "127.0.0.1"
      director:
        enabled: true
        source: package
        run_kickstart: true
        kickstart:
          config:
            endpoint: "{{ icinga2_constants.NodeName }}"
            host: "127.0.0.1"
            username: "{{ icinga2_objects[1].name }}"
            password: "{{ icinga2_objects[1].password }}"
        config:
          db:
            resource: "director_db"
      perfdatagraphs:
        enabled: true
        source: package
        config:
          perfdatagraphs:
            default_backend: prometheus
      perfdatagraphsprometheus:
        enabled: true
        source: package
        config:
          prometheus:
            api_url: "http://localhost:9090"
      #vspheredb:
      #  enabled: true
      #  source: package
      #  config:
      #    db:
      #      resource: "vspheredb_db"
      cube:
        enabled: true
        source: package
      businessprocess:
        enabled: true
        source: package
      totp:
        enabled: true
        source: package
        config:
          database:
            resource: "totp_db"
          settings:
            issuer: Icinga Web 2 Demo
            leeway: 15
        database:
          import_schema: true
          type: mysql
          host: "localhost"
          name: "{{ mysql_databases_totp.name }}"
          user: "{{ mysql_databases_totp.username }}"
          password: "{{ mysql_databases_totp.password }}"
      doc:
        enabled: true
        source: package
      x509:
        source: package
        enabled: true
        config:
          backend:
            resource: "x509_db"
        database:
          import_schema: true
          type: mysql
          host: "localhost"
          name: "{{ mysql_databases_x509.name }}"
          user: "{{ mysql_databases_x509.username }}"
          password: "{{ mysql_databases_x509.password }}"
        certificate_files:
          - "/etc/ssl/certs/ca-certificates.crt"

    ### Monitoring Plugins
    icinga_monitoring_plugins_check_commands:
      - all
